name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      commit:
        description: Full source commit SHA (manual Release only)
        required: false
        type: string
        default: ''
      version:
        description: Version to set before packaging (manual Release only)
        required: false
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Minimal package checks
    runs-on: macos-15
    timeout-minutes: 10
    env:
      LC_ALL: C
      LANG: C
      LANGUAGE: C
      PYTHONNOUSERSITE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'
      - name: Set release version
        if: inputs.version != ''
        env:
          ORCA_VERSION: ${{ inputs.version }}
        run: python tools/release.py set-version --version "$ORCA_VERSION"
      - name: Check source syntax
        run: |
          python -m compileall -q src tools
          for script in setup.sh uninstall.sh tools/build_macos.sh; do
            sh -n "$script"
          done
      - name: Prepare package builder
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --constraint requirements-lock.txt hatchling
          .venv/bin/python -m pip check
      - name: Build and check release files
        run: .venv/bin/python tools/check_release.py --minimal --output-dir dist/ci
      - name: Preserve verified release assets
        if: inputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ inputs.commit }}-${{ inputs.version }}
          path: dist/ci/*
          if-no-files-found: error
          retention-days: 7

